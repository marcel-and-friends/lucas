syntax = "proto3";

message HeaterControl {
  message Start {
    int32 target_temperature = 1;
    int32 duration_ms = 2;

    int32 preheat_duration_ms = 3;
    float preheat_multiplier = 4;

    float p = 5;
    float i = 6;
    float d = 7;
  }

  message Stop {}

  oneof tag {
    Start start = 1;
    Stop stop = 2;
  }
}
