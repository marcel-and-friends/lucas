syntax = "proto3";

message HeaterControl {
  message Start {
    int32 target_temperature = 1;
    int32 duration_ms = 2;

    float preheat_power_multiplier = 4;
    float preheat_duration_multiplier = 5;

    float p = 6;
    float i = 7;
    float d = 8;
  }

  message Stop {}

  message Standby {}

  oneof tag {
    Start start = 1;
    Stop stop = 2;
    Standby standby = 3;
  }
}
